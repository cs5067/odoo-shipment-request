name: odoo-shipment

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U odoo -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  odoo:
    image: odoo:19
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    ports:
      - "127.0.0.1:18069:8069"
    volumes:
      - ./shipment_request:/mnt/extra-addons/shipment_request:ro
      - odoo-data:/var/lib/odoo
    command:
      - odoo
      - --database=shipment_demo
      - --db-filter=^shipment_demo$
      - --no-database-list
      - --http-interface=0.0.0.0

volumes:
  postgres-data:
  odoo-data:
